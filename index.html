<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Undefined Corner — Keynder</title>

<style>
:root {
  --card-w: 63mm;
  --card-h: 88mm;

  --safe-x: 3.5mm;
  --safe-y: 3.4mm;
  --art-size: 48mm;

  --bg: #06070a;
  --panel: #0b0d11;
  --panel-2: #11141a;

  --text: #f6f7f9;
  --muted: #979ca7;

  /* Gold Edition */
  --edition: #d5ad4f;
  --edition-hi: #f2d98d;
  --edition-low: #705821;

  /* Booster Variant */
  --booster: #8a5cff;
  --booster-2: #c45cff;
  --booster-3: #ff6fd8;

  /* INTP Personality Signature */
  --personality: #666ee8;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #17191e;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, Arial, sans-serif;
}

.scene {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  perspective: 1350px;
  perspective-origin: 50% 45%;
  transform-style: preserve-3d;
}

.scene,
.scene * {
  transform-style: preserve-3d;
}

.card {
  transform:
    rotateX(var(--rx, 0deg))
    rotateY(var(--ry, 0deg))
    translateZ(0);
  transform-origin: center center;
  will-change: transform, box-shadow;
}

.card-shadow {
  position: absolute;
  inset: 0;
  z-index: -10;
  pointer-events: none;
  border-radius: 2mm;
  transform:
    translateZ(-40px)
    translateY(8px)
    scale(.96);
  filter: blur(10px);
  opacity: .55;
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,.52), rgba(0,0,0,.0) 70%);
  transition: transform .25s ease, opacity .25s ease;
}

.card-glare {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 40;
  mix-blend-mode: screen;
  opacity: var(--glare-opacity, 0);
  background:
    radial-gradient(
      circle at var(--gx, 50%) var(--gy, 35%),
      rgba(255,255,255,.24) 0%,
      rgba(255,255,255,.10) 10%,
      rgba(255,255,255,0) 34%
    );
  transition: opacity .25s ease;
}

.header { transform: translateZ(18px); }
.edition { transform: translateZ(28px); }
.brand { transform: translateZ(18px); }

.booster-aura {
  transform:
    translateX(-50%)
    translateZ(16px);
}

.art-shell {
  transform: translateZ(34px);
}

.art-image-wrap {
  transform: translateZ(14px);
}

.art-image {
  transform: translateZ(24px) scale(1.01);
}

.art-vignette {
  transform: translateZ(30px);
}

.art-corner {
  transform: translateZ(36px);
}

.info {
  transform: translateZ(22px);
}

.category-line,
.name,
.collection,
.divider,
.tags {
  transform: translateZ(20px);
}

.booster {
  transform: translateZ(26px);
}

.personality {
  transform: translateZ(24px);
}

.texture {
  transform: translateZ(-8px);
}

.card.booster-active {
  box-shadow:
    0 0 0 .62mm #050608,
    0 0 0 .92mm rgba(213,173,79,.38),
    0 12mm 30mm rgba(0,0,0,.48);
}

@media (hover: hover) and (pointer: fine) {
  .scene:hover .card {
    transition: transform .12s ease-out, box-shadow .18s ease-out;
  }

  .scene:hover .card-shadow {
    opacity: .72;
  }
}


.card {
  container-type: inline-size;
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  overflow: hidden;
  isolation: isolate;
  color: var(--text);
  transition: box-shadow .25s ease;

  background:
    radial-gradient(circle at 74% -5%, rgba(213,173,79,.18), transparent 28%),
    linear-gradient(155deg, #11141a 0%, #07080b 48%, #050608 100%);

  border: .32mm solid rgba(242,217,141,.72);

  box-shadow:
    0 0 0 .62mm #050608,
    0 0 0 .92mm rgba(213,173,79,.38),
    0 10mm 25mm rgba(0,0,0,.58);
}

.card::before {
  content: "";
  position: absolute;
  inset: 1.25mm;
  z-index: 30;
  pointer-events: none;
  border: .16mm solid rgba(242,217,141,.30);

  clip-path: polygon(
    0 3.5mm,
    3.5mm 0,
    calc(100% - 3.5mm) 0,
    100% 3.5mm,
    100% calc(100% - 3.5mm),
    calc(100% - 3.5mm) 100%,
    3.5mm 100%,
    0 calc(100% - 3.5mm)
  );
}

.card::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 20;
  pointer-events: none;

  background:
    linear-gradient(
      116deg,
      transparent 0 41%,
      rgba(255,255,255,.035) 42% 44%,
      transparent 45% 100%
    ),
    radial-gradient(
      circle at 50% 102%,
      rgba(213,173,79,.12),
      transparent 37%
    );

  mix-blend-mode: screen;
}

.texture {
  position: absolute;
  inset: 0;
  z-index: -2;
  opacity: .28;
  pointer-events: none;

  background:
    linear-gradient(
      28deg,
      transparent 0 48%,
      rgba(255,255,255,.024) 49% 50%,
      transparent 51% 100%
    ),
    linear-gradient(
      -28deg,
      transparent 0 48%,
      rgba(255,255,255,.018) 49% 50%,
      transparent 51% 100%
    );

  background-size: 8mm 8mm;
}

.layout {
  position: absolute;
  inset:
    var(--safe-y)
    var(--safe-x)
    var(--safe-y)
    var(--safe-x);

  z-index: 10;

  display: grid;
  grid-template-rows:
    6.7mm
    1.4mm
    var(--art-size)
    1.7mm
    minmax(0, 1fr);
}

/* =========================
   HEADER
   ========================= */

.header {
  min-width: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 2.2mm;
}

.brand {
  min-width: 0;
  padding-top: .45mm;
}

.brand-name {
  max-width: 35mm;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  font-size: 2.45mm;
  line-height: 1;
  font-weight: 950;
  letter-spacing: .145em;
  text-transform: uppercase;
}

.brand-sub {
  margin-top: .75mm;

  color: rgba(246,247,249,.46);

  font-size: 1.28mm;
  line-height: 1;
  font-weight: 800;
  letter-spacing: .19em;
  text-transform: uppercase;
}

.edition {
  flex: 0 0 auto;
  min-width: 13.2mm;

  padding: 1.15mm 1.7mm 1.05mm;

  text-align: center;

  border: .16mm solid rgba(242,217,141,.57);

  background:
    linear-gradient(
      180deg,
      rgba(213,173,79,.18),
      rgba(9,10,13,.76)
    );

  clip-path: polygon(
    1.8mm 0,
    100% 0,
    100% calc(100% - 1.8mm),
    calc(100% - 1.8mm) 100%,
    0 100%,
    0 1.8mm
  );
}

.edition-main {
  color: var(--edition-hi);

  font-size: 2.12mm;
  line-height: 1;
  font-weight: 1000;
  letter-spacing: .10em;
  text-transform: uppercase;
}

.edition-sub {
  margin-top: .55mm;

  color: rgba(246,247,249,.52);

  font-size: 1.14mm;
  line-height: 1;
  font-weight: 800;
  letter-spacing: .16em;
  text-transform: uppercase;
}


/* =========================
   BOOSTER AURA MODE
   ========================= */

.booster-active::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;

  background:
    radial-gradient(circle at 50% 36%, rgba(196,92,255,.15), transparent 18%),
    radial-gradient(circle at 18% 42%, rgba(255,111,216,.08), transparent 20%),
    radial-gradient(circle at 82% 44%, rgba(138,92,255,.10), transparent 20%);
  mix-blend-mode: screen;
}

.booster-aura {
  position: absolute;
  left: 50%;
  top: calc(var(--safe-y) + 8.1mm);
  width: calc(var(--art-size) + 8mm);
  height: calc(var(--art-size) + 8mm);
  transform: translateX(-50%);
  z-index: 2;
  pointer-events: none;
  opacity: 0;
}

.booster-aura::before,
.booster-aura::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18%;
}

.booster-aura::before {
  background:
    radial-gradient(circle at 50% 50%,
      rgba(255,111,216,.00) 34%,
      rgba(255,111,216,.16) 48%,
      rgba(138,92,255,.24) 58%,
      rgba(138,92,255,.08) 68%,
      transparent 76%);
  filter: blur(3.4mm);
  transform: scale(1.02);
}

.booster-aura::after {
  background:
    linear-gradient(125deg,
      transparent 0 28%,
      rgba(255,111,216,.14) 32% 34%,
      transparent 38% 58%,
      rgba(196,92,255,.14) 62% 64%,
      transparent 68% 100%),
    radial-gradient(circle at 50% 50%,
      rgba(255,111,216,.00) 42%,
      rgba(255,111,216,.12) 58%,
      transparent 74%);
  filter: blur(1.3mm);
  mix-blend-mode: screen;
}

.booster-active .booster-aura {
  opacity: 1;
}

.booster-active .art-shell {
  border-color: rgba(255,111,216,.58);
  box-shadow:
    inset 0 0 0 .65mm rgba(5,6,8,.90),
    0 0 0 .18mm rgba(196,92,255,.40),
    0 0 4mm rgba(138,92,255,.22),
    0 0 8mm rgba(255,111,216,.16),
    0 2mm 5mm rgba(0,0,0,.38);
}

.booster-active .art-shell::before {
  content: "";
  position: absolute;
  inset: -2.3mm;
  z-index: -1;
  pointer-events: none;
  clip-path: polygon(
    0 3mm,
    3mm 0,
    calc(100% - 3mm) 0,
    100% 3mm,
    100% calc(100% - 3mm),
    calc(100% - 3mm) 100%,
    3mm 100%,
    0 calc(100% - 3mm)
  );
  background:
    radial-gradient(circle at 50% 50%, rgba(255,111,216,.08), rgba(138,92,255,.18) 52%, transparent 74%);
  filter: blur(2.5mm);
}

.booster-active .art-shell::after {
  content: "";
  position: absolute;
  inset: -1.1mm;
  pointer-events: none;
  clip-path: polygon(
    0 3mm,
    3mm 0,
    calc(100% - 3mm) 0,
    100% 3mm,
    100% calc(100% - 3mm),
    calc(100% - 3mm) 100%,
    3mm 100%,
    0 calc(100% - 3mm)
  );
  border: .14mm solid rgba(255,111,216,.26);
  mix-blend-mode: screen;
}

.booster-active .art-corner {
  border-left-color: var(--booster-2);
  color: rgba(255,236,251,.88);
  box-shadow: 0 0 3mm rgba(196,92,255,.12);
}

.booster-active .booster {
  border-color: rgba(255,111,216,.72);
  color: #fff3fd;
  background:
    linear-gradient(180deg, rgba(255,111,216,.22), rgba(34,13,39,.58)),
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.12), transparent 42%);
  box-shadow:
    inset 0 0 3mm rgba(255,111,216,.10),
    0 0 2.4mm rgba(196,92,255,.16);
}

.booster-active .divider {
  background:
    linear-gradient(
      90deg,
      rgba(255,111,216,.95),
      rgba(196,92,255,.30),
      rgba(213,173,79,.15)
    );
}

/* =========================
   FIXED ART WINDOW
   ========================= */

.art-shell {
  position: relative;
  justify-self: center;

  width: var(--art-size);
  height: var(--art-size);

  overflow: hidden;

  border: .22mm solid rgba(242,217,141,.48);

  background:
    radial-gradient(circle at 50% 25%, rgba(213,173,79,.10), transparent 44%),
    #090b0f;

  box-shadow:
    inset 0 0 0 .65mm rgba(5,6,8,.90),
    0 2mm 5mm rgba(0,0,0,.38);

  clip-path: polygon(
    0 3mm,
    3mm 0,
    calc(100% - 3mm) 0,
    100% 3mm,
    100% calc(100% - 3mm),
    calc(100% - 3mm) 100%,
    3mm 100%,
    0 calc(100% - 3mm)
  );
}

.art-image-wrap {
  position: absolute;
  inset: 1.2mm;

  display: grid;
  place-items: center;

  overflow: hidden;

  background: rgba(4,5,7,.55);
}

.art-image {
  display: block;
  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center;
}

.art-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    linear-gradient(to bottom, rgba(0,0,0,.05), transparent 55%, rgba(0,0,0,.34)),
    radial-gradient(circle at 50% 46%, transparent 55%, rgba(0,0,0,.31) 100%);
}

.art-corner {
  position: absolute;
  left: 1.5mm;
  bottom: 1.4mm;

  padding: .9mm 1.1mm;

  border-left: .42mm solid var(--edition);

  background: rgba(5,6,8,.72);

  color: rgba(246,247,249,.74);

  font-size: 1.22mm;
  line-height: 1;
  font-weight: 850;
  letter-spacing: .14em;
  text-transform: uppercase;

  backdrop-filter: blur(1.5mm);
}

/* =========================
   MEMBER INFO
   ========================= */

.info {
  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;
}

.category-line {
  display: flex;
  align-items: center;
  gap: 1.2mm;

  min-width: 0;

  color: var(--edition-hi);

  font-size: 1.48mm;
  line-height: 1;
  font-weight: 950;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.category-line::before {
  content: "";
  flex: 0 0 6.5mm;
  height: .20mm;

  background:
    linear-gradient(
      90deg,
      var(--edition),
      rgba(213,173,79,0)
    );
}

.category-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.name {
  max-width: 100%;
  margin: 1.25mm 0 0;

  overflow: hidden;
  white-space: nowrap;

  font-size: 6.65mm;
  line-height: .92;
  font-weight: 1000;
  letter-spacing: -.045em;
  text-transform: uppercase;

  text-shadow: 0 1.2mm 2.6mm rgba(0,0,0,.62);
}

.collection {
  min-width: 0;
  margin-top: 1.25mm;

  color: rgba(246,247,249,.60);

  font-size: 1.62mm;
  line-height: 1.05;
  font-weight: 760;
  letter-spacing: .10em;
  text-transform: uppercase;

  overflow-wrap: anywhere;
}

.divider {
  height: .18mm;
  margin: 1.9mm 0 1.65mm;

  background:
    linear-gradient(
      90deg,
      rgba(213,173,79,.92),
      rgba(213,173,79,.10)
    );
}

.tags {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 1.15mm;

  min-width: 0;
}

.tag {

  min-width: 0;

  font-size: 1.45mm;
  line-height: 1;
  font-weight: 900;

  text-transform: uppercase;

  overflow: hidden;
  text-overflow: ellipsis;

  clip-path: polygon(
    1.2mm 0,
    100% 0,
    100% calc(100% - 1.2mm),
    calc(100% - 1.2mm) 100%,
    0 100%,
    0 1.2mm
  );
}

.booster {
  border: .16mm solid rgba(138,92,255,.58);
  color: #f1ebff;

  background:
    linear-gradient(
      180deg,
      rgba(138,92,255,.20),
      rgba(20,15,35,.50)
    );

  box-shadow:
    inset 0 0 2.5mm rgba(138,92,255,.08);
}

.personality {
  display: inline-flex;
  align-items: center;
  gap: .8mm;

  border: .16mm solid rgba(102,110,232,.58);

  color: #f1f2ff;

  background:
    linear-gradient(
      180deg,
      rgba(102,110,232,.20),
      rgba(14,16,37,.50)
    );

  box-shadow:
    inset 0 0 2.5mm rgba(102,110,232,.08);
}

.personality-icon {
  color: #aeb3ff;
  font-size: 1.85mm;
  line-height: .8;
}

.personality-type {
  line-height: 1;
}

/* Text safety for longer variable content */
@container (max-width: 63mm) {
  .name {
    font-size: 6.65mm;
  }
}

@media print {
  @page {
    size: 63mm 88mm;
    margin: 0;
  }

  html, body {
    width: 63mm;
    height: 88mm;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden;
    background: #000;
  }

  body {
    display: block;
  }

  .card {
    width: 63mm;
    height: 88mm;
    margin: 0;
    box-shadow: none;

    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
}
</style>

/* ========================================================== */

const $ = id => document.getElementById(id);

$("serverName").textContent = member.serverName;
$("memberName").textContent = member.name;
$("category").textContent =
  member.categoryCode
    ? `${member.categoryCode} · ${member.categoryName}`
    : member.categoryName;

$("edition").textContent = member.edition;
$("collection").textContent = member.collection;

$("variant").textContent = member.variant;
$("variant").style.display =
  member.variant && member.variant.trim() ? "block" : "none";

const isBoosterVariant =
  member.variant && /booster/i.test(member.variant);

document.querySelector(".card").classList.toggle("booster-active", !!isBoosterVariant);

$("personalityIcon").textContent = member.personalityIcon;
$("mbti").textContent = member.mbti.toUpperCase();
$("personality").style.display =
  member.mbti && member.mbti.trim() ? "inline-flex" : "none";

$("memberImage").src = member.image;

/* ----------------------------------------------------------
   Responsive text fitting.
   Keeps variable text inside its assigned width/margins.
   ---------------------------------------------------------- */
function fitSingleLine(el, minPx) {
  if (!el) return;

  const computed = getComputedStyle(el);
  let size = parseFloat(computed.fontSize);

  while (el.scrollWidth > el.clientWidth && size > minPx) {
    size -= 0.4;
    el.style.fontSize = size + "px";
  }
}

function fitCardText() {
  fitSingleLine($("memberName"), 16);
  fitSingleLine($("serverName"), 7);
  fitSingleLine($("category"), 6);
}

requestAnimationFrame(fitCardText);
window.addEventListener("resize", fitCardText);

/* ----------------------------------------------------------
   Limited 3D movement.
   Does not flip the card; only small controlled tilt.
   ---------------------------------------------------------- */
const scene = document.getElementById("scene");
const card3d = document.getElementById("card3d");
const glare = document.getElementById("cardGlare");
const cardShadow = scene.querySelector(".card-shadow");

const MAX_TILT_X = 7;   // vertical tilt range
const MAX_TILT_Y = 9;   // horizontal tilt range

function setTilt(clientX, clientY) {
  const rect = scene.getBoundingClientRect();
  const px = (clientX - rect.left) / rect.width;
  const py = (clientY - rect.top) / rect.height;

  const ry = (px - 0.5) * (MAX_TILT_Y * 2);
  const rx = (0.5 - py) * (MAX_TILT_X * 2);

  card3d.style.setProperty("--rx", `${rx.toFixed(2)}deg`);
  card3d.style.setProperty("--ry", `${ry.toFixed(2)}deg`);

  scene.style.setProperty("--gx", `${(px * 100).toFixed(1)}%`);
  scene.style.setProperty("--gy", `${(py * 100).toFixed(1)}%`);
  scene.style.setProperty("--glare-opacity", "1");

  cardShadow.style.transform =
    `translateZ(-40px) translate(${(ry * 0.55).toFixed(2)}px, ${(8 + rx * -0.35).toFixed(2)}px) scale(.96)`;
}

function resetTilt() {
  card3d.style.setProperty("--rx", "0deg");
  card3d.style.setProperty("--ry", "0deg");
  scene.style.setProperty("--glare-opacity", "0");
  scene.style.setProperty("--gx", "50%");
  scene.style.setProperty("--gy", "35%");
  cardShadow.style.transform = "translateZ(-40px) translateY(8px) scale(.96)";
}

card3d.style.transition = "transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease";
cardShadow.style.transition = "transform .28s cubic-bezier(.2,.8,.2,1), opacity .25s ease";

scene.addEventListener("mousemove", (e) => setTilt(e.clientX, e.clientY));
scene.addEventListener("mouseleave", resetTilt);

scene.addEventListener("touchmove", (e) => {
  if (!e.touches.length) return;
  const t = e.touches[0];
  setTilt(t.clientX, t.clientY);
}, { passive: true });

scene.addEventListener("touchend", resetTilt);
scene.addEventListener("touchcancel", resetTilt);

resetTilt();
</script>
